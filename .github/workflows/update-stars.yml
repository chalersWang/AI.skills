name: Update star counts

on:
  schedule:
    # 每周一 03:17 UTC（避免整点拥挤）
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-stars
  cancel-in-progress: true

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update star counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_stars.py

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No star-count changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: 自动更新技能星数（auto-update star counts）[skip ci]"
          git push
